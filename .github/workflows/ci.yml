name: CI

# Les tests s'exécutent avant tout merge (sur la pull request) et après coup
# sur les branches protégées, pour couvrir aussi les pushs directs.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Une exécution obsolète est annulée dès qu'un nouveau commit arrive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Configurer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # sqlite : la suite tourne sur une base en mémoire (voir phpunit.xml)
          extensions: pdo_sqlite, sqlite3, mbstring, zip, gd, intl, bcmath
          coverage: none

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lancer la suite de tests
        run: php artisan test

  frontend:
    name: Front (build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # `npm run types` n'est pas encore branché : 11 erreurs TypeScript
      # préexistantes (dont des modules non installés) rendraient la CI rouge
      # d'emblée. À activer une fois la dette résorbée.
      - name: Compiler les assets
        run: npm run build
